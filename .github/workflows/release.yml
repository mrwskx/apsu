# Maintains a standing release PR on main: every conventional commit that
# lands updates the proposed version and CHANGELOG entry. Merging that PR tags
# the release and publishes the GitHub Release.
#
# The app token (rather than GITHUB_TOKEN) is deliberate: pushes made with
# GITHUB_TOKEN do not trigger workflows, so the release PR would never get its
# required `ci` check and could only be merged by admin bypass.
#
# `bump-minor-pre-major` in release-please-config.json is likewise deliberate:
# below 1.0.0 a breaking change bumps the minor. 1.0.0 is a stability promise to
# every npm consumer, so it is reached by a `Release-As: 1.0.0` commit when we
# decide the API has settled — never as a side effect of breaking something.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please commits CHANGELOG.md/package.json straight through the
      # GitHub API, bypassing prettier, so the release PR fails `format:check`
      # in ci.yml until we format it ourselves. Amended into release-please's
      # own commit (same author/message) rather than stacked on top, since
      # this branch carries no human commits to preserve.
      #
      # fetch-depth must be >1: a depth-1 (shallow) checkout hides the
      # commit's parent, so `git commit --amend` below would rewrite it as a
      # parentless orphan, and GitHub's diff against main would show the
      # entire repo as added.
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 2

      - name: Setup pnpm
        if: ${{ steps.release.outputs.pr }}
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ steps.release.outputs.pr }}
        run: pnpm install --frozen-lockfile

      - name: Format release PR files
        if: ${{ steps.release.outputs.pr }}
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name "$(git log -1 --format='%an')"
            git config user.email "$(git log -1 --format='%ae')"
            git commit -a --amend --no-edit
            git push --force-with-lease origin HEAD:${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fi
